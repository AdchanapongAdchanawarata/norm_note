name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace

  # Guarantee G1 (Zero Egress), enforced by the dependency graph rather than by
  # discipline. `cargo add reqwest` in norm-core has to fail the build, not get
  # caught in review.
  #
  # v0.1 has no networking at all: the only transport is a folder on the local
  # filesystem. When norm-net arrives, add `wrappers = ["norm-net"]` to the
  # specific entries in deny.toml rather than removing them.
  zero-egress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans licenses advisories
